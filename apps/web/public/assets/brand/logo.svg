<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200">
  <defs>
    <linearGradient id="mountainGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3EC6B8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2A9D8F;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="waterGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3EC6B8;stop-opacity:0.5" />
      <stop offset="50%" style="stop-color:#3EC6B8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3EC6B8;stop-opacity:0.5" />
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ===== 左侧图形标（160×160，居中于 x=80, y=100） ===== -->
  <g transform="translate(0, 20)">
    <!-- 背景圆角 -->
    <rect x="10" y="0" width="160" height="160" rx="32" ry="32" fill="#0A1220"/>
    <rect x="10" y="0" width="160" height="160" rx="32" ry="32" fill="none" stroke="#23364F" stroke-width="1.5"/>

    <!-- 远山 -->
    <polygon points="30,115 68,70 106,115" fill="#16263F" opacity="0.8"/>
    <polygon points="94,115 126,82 150,115" fill="#16263F" opacity="0.6"/>

    <!-- 主山峰 -->
    <polygon points="62,115 90,35 118,115" fill="url(#mountainGrad2)" filter="url(#glow2)"/>
    <polygon points="90,35 118,115 104,115 90,62" fill="#E8B84B" opacity="0.25"/>

    <!-- 像素点 -->
    <rect x="86" y="26" width="8" height="8" fill="#E8B84B" rx="1"/>
    <rect x="76" y="44" width="5" height="5" fill="#3EC6B8" opacity="0.7" rx="1"/>
    <rect x="100" y="40" width="5" height="5" fill="#3EC6B8" opacity="0.7" rx="1"/>

    <!-- 水波纹 -->
    <path d="M 28 128 Q 48 122 68 128 T 108 128 T 148 128" fill="none" stroke="url(#waterGrad2)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 36 142 Q 56 136 76 142 T 116 142" fill="none" stroke="#3EC6B8" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
    <path d="M 44 154 Q 64 148 84 154 T 124 154" fill="none" stroke="#3EC6B8" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  </g>

  <!-- ===== 右侧文字 ===== -->
  <!-- 主标题：永嘉新游 -->
  <text x="200" y="95" font-family="'Noto Serif SC', 'Source Han Serif SC', 'SimSun', serif" font-size="64" font-weight="700" fill="#EAF2FB" letter-spacing="8">永嘉新游</text>

  <!-- 主标题下方装饰线 -->
  <rect x="200" y="112" width="180" height="2" fill="#3EC6B8" opacity="0.6"/>
  <rect x="388" y="110" width="8" height="6" fill="#E8B84B" rx="1"/>

  <!-- 副标题 -->
  <text x="200" y="148" font-family="'Noto Sans SC', 'Source Han Sans SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="400" fill="#9FB0C7" letter-spacing="3">AI 数字文旅伴游平台</text>

  <!-- 英文小字 -->
  <text x="200" y="175" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="400" fill="#3EC6B8" opacity="0.7" letter-spacing="2">YONGJIA · SMART TRAVEL</text>
</svg>
