<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3EC6B8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2A9D8F;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3EC6B8;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#3EC6B8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3EC6B8;stop-opacity:0.6" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景圆角矩形（深色） -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="#0A1220"/>
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="none" stroke="#23364F" stroke-width="2"/>

  <!-- 远山（次要，暗色） -->
  <polygon points="80,340 200,200 320,340" fill="#16263F" opacity="0.8"/>
  <polygon points="280,340 380,240 460,340" fill="#16263F" opacity="0.6"/>

  <!-- 主山峰：石桅岩孤峰 -->
  <polygon points="180,340 256,100 332,340" fill="url(#mountainGrad)" filter="url(#glow)"/>
  <!-- 山峰高光面 -->
  <polygon points="256,100 332,340 290,340 256,180" fill="#E8B84B" opacity="0.25"/>

  <!-- 像素点（AI科技感，山顶周围） -->
  <rect x="248" y="72" width="16" height="16" fill="#E8B84B" rx="2"/>
  <rect x="224" y="120" width="10" height="10" fill="#3EC6B8" opacity="0.7" rx="1"/>
  <rect x="286" y="110" width="10" height="10" fill="#3EC6B8" opacity="0.7" rx="1"/>
  <rect x="200" y="160" width="8" height="8" fill="#E8B84B" opacity="0.5" rx="1"/>
  <rect x="310" y="150" width="8" height="8" fill="#E8B84B" opacity="0.5" rx="1"/>

  <!-- 水波纹（三条） -->
  <path d="M 70 380 Q 110 365 150 380 T 230 380 T 310 380 T 390 380 T 442 380" fill="none" stroke="url(#waterGrad)" stroke-width="5" stroke-linecap="round"/>
  <path d="M 90 410 Q 130 395 170 410 T 250 410 T 330 410 T 410 410" fill="none" stroke="#3EC6B8" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <path d="M 110 440 Q 150 425 190 440 T 270 440 T 350 440" fill="none" stroke="#3EC6B8" stroke-width="3" stroke-linecap="round" opacity="0.35"/>

  <!-- 水面像素倒影点 -->
  <rect x="240" y="394" width="6" height="6" fill="#E8B84B" opacity="0.6" rx="1"/>
  <rect x="268" y="404" width="5" height="5" fill="#3EC6B8" opacity="0.5" rx="1"/>
</svg>
